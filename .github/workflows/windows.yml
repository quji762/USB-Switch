name: Windows build and tests

# Push to master and pull requests both run the pipeline. workflow_dispatch
# stays for a manual rerun. The hosted image includes Visual Studio, so the
# MinGW job passes -Toolchain MinGW; Auto would take the MSVC branch.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        shell: msys2 {0}
        run: pwsh -NoProfile -File ./build.ps1 -Toolchain MinGW -WarningsAsErrors
      - name: Check source strings and executable resources
        shell: msys2 {0}
        run: |
          set -e
          python tools/check-strings.py
          python tools/check-resources.py dist/usb-switch.exe
      - name: Run unit and device enumeration tests
        shell: msys2 {0}
        run: pwsh -NoProfile -File ./tools/run-tests.ps1 -Runtime
      - name: Check CLI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/usb-switch.exe'
          python tests/cli.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI checks failed' }
          python tests/cli-output.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI Unicode output checks failed' }
          ./tests/migration.ps1 -Exe $exe
      - name: Run GUI smoke test
        shell: pwsh
        run: |
          ./tests/gui-smoke.ps1 -Exe (Join-Path $PWD 'dist/usb-switch.exe')
          if ($LASTEXITCODE -ne 0) { throw 'GUI smoke test failed' }
      - name: Build and test installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            $inno = Join-Path $env:TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $inno
            $install = Start-Process -FilePath $inno -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Inno Setup install failed: $($install.ExitCode)" }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found after install' }
          & $iscc /Qp installer/usb-switch.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $setup = Get-ChildItem dist/installer/usb-switch-setup-*.exe | Select-Object -First 1
          if (!$setup) { throw 'Installer not found' }
          ./tests/installer.ps1 -Installer $setup.FullName
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-switch-windows
          path: |
            dist/usb-switch.exe
            dist/installer/*.exe
          if-no-files-found: ignore

  msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # build.ps1 loads vcvars, then uses Ninja when it is on PATH and NMake
      # otherwise. The Visual Studio generator is avoided on purpose: together
      # with /MANIFESTINPUT it fails to link (CVT1100, duplicate manifest id 1).
      # The hosted image no longer ships the "Visual Studio 17 2022" generator.
      - name: Build with MSVC (warnings as errors)
        shell: pwsh
        run: |
          ./build.ps1 -Toolchain MSVC -WarningsAsErrors
          if ($LASTEXITCODE -ne 0) { throw 'MSVC build failed' }
      - name: Check source strings and executable resources
        shell: pwsh
        run: |
          python tools/check-strings.py
          if ($LASTEXITCODE -ne 0) { throw 'Source consistency check failed' }
          python tools/check-resources.py dist/usb-switch.exe
          if ($LASTEXITCODE -ne 0) { throw 'Resource check failed' }

name: Windows build and tests

# Automatic triggers are off: this pipeline only runs when started by hand from
# the Actions tab (workflow_dispatch). The same checks run locally through
# tools/run-tests.ps1 and the python checkers, which is how this repository is
# verified day to day. Re-add push/pull_request here to automate it again.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        shell: msys2 {0}
        run: pwsh -NoProfile -File ./build.ps1
      - name: Check source strings and executable resources
        shell: msys2 {0}
        run: |
          set -e
          python tools/check-strings.py
          python tools/check-resources.py dist/usb-switch.exe
      - name: Run unit and device enumeration tests
        shell: msys2 {0}
        run: pwsh -NoProfile -File ./tools/run-tests.ps1 -Runtime
      - name: Build and inspect MinGW executable
        shell: msys2 {0}
        run: |
          set -e
          cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DCMAKE_RC_COMPILER=windres -DQE_WARNINGS_AS_ERRORS=ON
          cmake --build build/mingw
          python tools/check-resources.py build/mingw/usb-switch.exe
          pwsh -NoProfile -File ./tests/migration.ps1 -Exe ./build/mingw/usb-switch.exe
      - name: Check CLI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/usb-switch.exe'
          python tests/cli.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI checks failed' }
          python tests/cli-output.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI Unicode output checks failed' }
          ./tests/migration.ps1 -Exe $exe
      - name: Run GUI smoke test
        shell: pwsh
        run: |
          ./tests/gui-smoke.ps1 -Exe (Join-Path $PWD 'dist/usb-switch.exe')
          if ($LASTEXITCODE -ne 0) { throw 'GUI smoke test failed' }
      - name: Build and test installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found on runner' }
          & $iscc /Qp installer/usb-switch.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $setup = Get-ChildItem dist/installer/usb-switch-setup-*.exe | Select-Object -First 1
          if (!$setup) { throw 'Installer not found' }
          ./tests/installer.ps1 -Installer $setup.FullName
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-switch-windows
          path: |
            dist/usb-switch.exe
            dist/installer/*.exe
          if-no-files-found: ignore

  msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Compiles the MSVC-only paths the MinGW job never touches: /W4 /WX
      # (QE_WARNINGS_AS_ERRORS) and the static MSVC runtime. Ninja rather than
      # the "Visual Studio 17 2022" generator on purpose: that generator fails to
      # link with the /MANIFESTINPUT option CMakeLists.txt sets (CVT1100,
      # duplicate MANIFEST id 1), and build.ps1 already proves the Ninja path.
      - name: Build with MSVC (Ninja generator, warnings as errors)
        shell: pwsh
        run: |
          cmake -S . -B build/msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DQE_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build/msvc
          if ($LASTEXITCODE -ne 0) { throw 'MSVC build failed' }
      - name: Check source strings and executable resources
        shell: pwsh
        run: |
          python tools/check-strings.py
          if ($LASTEXITCODE -ne 0) { throw 'Source consistency check failed' }
          python tools/check-resources.py build/msvc/usb-switch.exe
          if ($LASTEXITCODE -ne 0) { throw 'Resource check failed' }
